<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jellyfin Featured</title>
  </head>
  <body>
    <div id="FeaturedConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
      <div data-role="content">
        <div id="FeaturedConfigApp"></div>
      </div>

      <script type="text/javascript">
        (function () {
          // The bundle stays loaded for the whole session, so a rebuilt page only needs mounting.
          if (window.JellyfinFeaturedConfig) {
            window.JellyfinFeaturedConfig.mount();
            return;
          }

          // A first load still in flight mounts whichever page is current when it finishes.
          const scriptId = 'featuredConfigBundle';
          if (document.getElementById(scriptId)) return;

          const apiClient = window.ApiClient || window.apiClient;
          const scriptUrl =
            apiClient && typeof apiClient.getUrl === 'function'
              ? apiClient.getUrl('featured/config-script')
              : new URL('featured/config-script', window.location.origin + '/').toString();

          if (!scriptUrl) {
            throw new Error('Could not resolve the Jellyfin Featured configuration bundle URL.');
          }

          const script = document.createElement('script');
          const separator = scriptUrl.includes('?') ? '&' : '?';
          script.src = scriptUrl + separator + 'instance=' + Date.now().toString(36);
          script.id = scriptId;
          script.async = false;
          script.onerror = function () {
            script.remove();
          };
          document.head.appendChild(script);
        })();
      </script>
    </div>
  </body>
</html>
