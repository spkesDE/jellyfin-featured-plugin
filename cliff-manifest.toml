[changelog]
header = ""
body = """
{% set features = commits | filter(attribute="group", value="Features") -%}
{% set fixes = commits | filter(attribute="group", value="Fixes") -%}
{% set performance = commits | filter(attribute="group", value="Performance") -%}

{% for commit in features -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% for commit in fixes -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% for commit in performance -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
"""
trim = true
footer = ""

postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
# Order tags by date: with topo_order = true git-cliff lists them by name, so v12.10 sorts before v12.2 and --latest picks the wrong tag.
topo_order = false
sort_commits = "oldest"

# Only user-facing changes reach the changelog: features, fixes and performance work.
# Changes to the release tooling, CI, docs and dependencies are skipped even when typed feat/fix.
[[git.commit_parsers]]
message = '^(feat|fix|perf)\((build|ci|release|beta|dependabot|readme|docs|deps|tooling|dev|test|tests|contracts|format|lint)\)'
skip = true

[[git.commit_parsers]]
message = '^feat(\([^)]*\))?!?:'
group = "Features"

[[git.commit_parsers]]
message = '^fix(\([^)]*\))?!?:'
group = "Fixes"

[[git.commit_parsers]]
message = '^perf(\([^)]*\))?!?:'
group = "Performance"

[[git.commit_parsers]]
message = ".*"
skip = true
