[changelog]
header = "# Changelog\n\n"
body = """
{% if version -%}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}

### {{ group | striptags | trim }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endfor %}
"""
trim = true
footer = ""
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
# Order tags by date: with topo_order = true git-cliff lists them by name, so v12.10 sorts before v12.2 and --latest picks the wrong tag.
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

# Only user-facing changes reach the changelog: features, fixes and performance work.
# Changes to the release tooling, CI, docs and dependencies are skipped even when typed feat/fix.
[[git.commit_parsers]]
message = '^(feat|fix|perf)\((build|ci|release|beta|dependabot|readme|docs|deps|tooling|dev|test|tests|contracts|format|lint)\)'
skip = true

[[git.commit_parsers]]
message = '^feat(\([^)]*\))?!?:'
group = "<!-- 0 -->Features"

[[git.commit_parsers]]
message = '^fix(\([^)]*\))?!?:'
group = "<!-- 1 -->Fixes"

[[git.commit_parsers]]
message = '^perf(\([^)]*\))?!?:'
group = "<!-- 2 -->Performance"

[[git.commit_parsers]]
message = ".*"
skip = true
