name: Translation status

on:
  push:
    branches: [main]
    paths:
      - 'src/i18n/locales/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: update translation status
    runs-on: ubuntu-latest

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate translation status graphic
        run: node scripts/update-i18n-status.mjs

      - name: Get release app bot user id
        id: app-user
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit updated graphic
        run: |
          if git diff --quiet -- docs/i18n-status.svg; then
            echo "Translation status is already up to date."
            exit 0
          fi

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add docs/i18n-status.svg
          git commit -m "docs: update translation status"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
