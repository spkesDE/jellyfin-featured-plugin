name: Translation status

on:
  push:
    branches: [main]
    paths:
      - "src/i18n/locales/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: update translation status
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate translation status graphic
        run: node scripts/update-i18n-status.mjs

      - name: Commit updated graphic
        run: |
          if git diff --quiet -- docs/i18n-status.svg; then
            echo "Translation status is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/i18n-status.svg
          git commit -m "docs: update translation status"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
