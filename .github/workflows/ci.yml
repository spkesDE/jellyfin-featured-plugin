name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend bundle
        run: npm run bundle

      - name: Test frontend and source contracts
        run: npm test

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore JellyfinFeatured.sln

      - name: Build
        run: dotnet build JellyfinFeatured.sln --configuration Release --no-restore -p:UseSharedCompilation=false

      - name: Test
        run: dotnet test Jellyfin.Plugin.Featured.Tests/Jellyfin.Plugin.Featured.Tests.csproj --configuration Release --no-build
