name: Translation / localization
description: Request a new language or report a translation issue
title: "[i18n]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new language requests, missing strings, or wording improvements in Jellyfin Featured.

  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - New language
        - Missing translation
        - Incorrect translation
        - Wording improvement
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. French
    validations:
      required: true

  - type: input
    id: locale
    attributes:
      label: Locale code
      placeholder: e.g. fr
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe what should be added or changed.
    validations:
      required: true

  - type: textarea
    id: strings
    attributes:
      label: Affected keys or current text
      description: Add the translation keys or visible text when reporting an existing translation.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or notes if they help explain the wording or context.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in providing or reviewing the translation.
